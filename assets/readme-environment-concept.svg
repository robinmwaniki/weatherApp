<rect width="1200" height="680" rx="28" fill="#e8f1ff"/><text x="44" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#142b4b">Environmental Insights</text><text x="44" y="84" font-family="Arial,sans-serif" font-size="15" fill="#58708e">Air quality, UV exposure and expected precipitation</text>
