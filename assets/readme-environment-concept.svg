<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Skyline environmental insights visual concept</title><desc id="desc">Illustrative environmental insights page with air quality, UV index, precipitation probability and hourly rain chart.</desc>
