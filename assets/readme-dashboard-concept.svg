<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Skyline weather dashboard visual concept</title><desc id="desc">Illustrative weather dashboard with city search, Nairobi weather conditions, metric cards and a five-day forecast.</desc>
